name: Build Material Manager APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تجهيز Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. فك ضغط ملف الـ ZIP بالاسم الصحيح الموجود في المستودع
      - name: Extract ZIP project
        shell: bash
        run: |
          # العثور على ملف الـ ZIP الذي يبدأ بـ Material تلقائياً لتجنب مشاكل الأسماء
          ZIP_FILE=$(ls Material*.zip | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP file: $ZIP_FILE, extracting..."
          
          mkdir -p /tmp/material-project
          unzip -o "$ZIP_FILE" -d /tmp/material-project

          if [ -d "/tmp/material-project/app" ]; then
            cp -a /tmp/material-project/. .
          else
            SUBFOLDER=$(ls /tmp/material-project | head -n 1)
            cp -a /tmp/material-project/$SUBFOLDER/. .
          fi

          echo "ZIP extracted and files moved successfully!"

      # 4. التأكد من وجود ملفات المشروع الأساسية
      - name: Check project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Project files found successfully!"

      # 5. بناء تطبيق APK عبر Gradle وتنزيل الأدوات تلقائياً
      - name: Build Android APK with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          arguments: assembleDebug

      # 6. رفع APK كملف قابل للتنزيل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialManager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
