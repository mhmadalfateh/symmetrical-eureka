name: Build Material Manager APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تجهيز Java 17 (مطلوبة لأحدث إصدارات أندرويد)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. فك ضغط المشروع
      - name: Extract ZIP project
        shell: bash
        run: |
          if [ ! -f "MaterialManager-Android.zip" ]; then
            echo "ERROR: MaterialManager-Android.zip not found!"
            exit 1
          fi

          mkdir -p /tmp/material-project

          unzip -o MaterialManager-Android.zip \
            -d /tmp/material-project

          cp -a /tmp/material-project/. .

          echo "ZIP extracted successfully!"

      # 4. التأكد من وجود ملفات المشروع
      - name: Check project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Project files found successfully!"

      # 5. بناء تطبيق APK وتنزيل الأدوات المطلوبة تلقائياً عبر Gradle
      - name: Build Android APK with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          arguments: assembleDebug

      # 6. رفع APK كملف قابل للتنزيل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialManager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
